<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1014" />
    <meta name="description" content="Card and party games to play with friends on your phones. No accounts, just a room code." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GameCrow" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>GameCrow</title>
    <script>
      // Apply saved theme before first paint to avoid a flash.
      try {
        var p = JSON.parse(localStorage.getItem("gamecrow:prefs") || "{}");
        document.documentElement.dataset.theme = p.theme || "dark";
        document.documentElement.dataset.fourColor = String(!!p.fourColor);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
